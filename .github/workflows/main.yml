
name: PushPlus NotifyPushPlus NotifyPushPlus NotifyPushPlus NotifyPushPlus NotifyPushPlus NotifyPushPlus NotifyPushPlus Notify

on:
  schedule:
    # 每天北京时间 08:00 执行
    # GitHub 用 UTC 时区，北京时间减 8 小时
    - cron: '0 0 * * *'

  # 允许手动运行（方便测试）
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latestubuntu-latest
    steps:
      - uses: actions/checkout@v4actions/checkout@v4

      - uses: actions/setup-python@v5actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requestspip install requests

      - name: Send notificationSend notification
        env:
          PUSHPLUS_TOKEN: $$${{ secrets.PUSHPLUS_TOKEN  secrets.PUSHPLUS_TOKEN }}
        run: python scripts/pushplus_notify.pypython scripts/pushplus_notify.py
